name: release

# 发版流水线：tag 触发（v*），windows-latest 构建 release 版 exe，
# 计算 sha256 并上传到对应 GitHub Release（可复用长期方案，v0.3.16 引入）。
#
# T-05（实施令 P1，2026-10-20）：upload 前注入最近一次 nightly 状态到
# Release 说明。C-F5/F-B1/F-A9 裁决——注入失败 ≠ 发布失败：注入步
# continue-on-error: true 且脚本内 || true，读取失败时写兜底文案
# 「最近一次 nightly：状态读取失败（发布时刻 API 不可用）」照常发布；
# 失败信号本身由 nightly.yml 的 N-2 开单承载，不阻塞发版。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # E18 签名链演练（2026-10-24）：dry_run=true 时走完 ci-gate / 构建 /
      # 签名 / 公钥自验全部步骤，但跳过 Release 创建与资产上传——
      # 不产生任何真实 tag / Release，专用于正式发版前的签名链验证。
      dry_run:
        description: "演练模式：走完构建/签名/自验，跳过 Release 创建与资产上传"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # T-05：注入步读 nightly run 历史（gh run list）

env:
  CARGO_TERM_COLOR: always

jobs:
  # R1 发布门禁①（test+clippy 前置）：build 前复用 ci.yml 全量门禁
  # （fmt --check / clippy -D warnings / 全量 test / 协议冻结 / 构建），
  # 任一步骤不过则发布失败。经 workflow_call 复用，口径与 main 门禁唯一。
  ci-gate:
    uses: ./.github/workflows/ci.yml

  # R1 发布门禁②（main 祖先断言）：被 tag 的 commit 必须已存在于 main，
  # 防止对未合入 main 的提交（如 PR 分支头 / 本地临时 tag）发布。
  verify-tag-on-main:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: assert tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "OK：被 tag 的 commit ${{ github.sha }} 已存在于 main"
          else
            echo "::error::被 tag 的 commit ${{ github.sha }} 不在 main 分支上，发布中止"
            exit 1
          fi

  build-release:
    needs: [ci-gate, verify-tag-on-main]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: volttray
    env:
      # E18（红蓝对抗终审，2026-10-24）：minisign 签名密钥。GitHub Actions
      # 不允许在 step 级 if 里直接引用 secrets 上下文，按官方惯例映射为
      # job 级环境变量做条件判断。密钥本体只存在于仓库 Secrets，
      # 不落盘进产物 / 日志 / commit；未配置时按降级策略跳过签名照常发布。
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      # 工具链锁定 1.90.0（与 rust-toolchain.toml / ci.yml 一致，见 docs/decisions.md D-01）
      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      - name: build release exe
        run: cargo build --release --locked -p volttray-tray

      - name: sha256 checksum
        shell: bash
        run: |
          cd target/release
          sha256sum volttray-tray.exe | tee volttray-tray.exe.sha256.txt

      # 相位二（第 3 项）：发布契约断言——资产名/数量/sha256 格式/自启
      # 注册表路径静态断言，拦截 U-7/D-83 类「发布与验证脱节」失效；
      # 资产名 volttray-tray.exe 在品牌纪元内冻结（更名即红）。
      - name: release-contract assertions
        shell: bash
        run: |
          set -euo pipefail
          # ① 资产存在性与名称冻结
          test -f target/release/volttray-tray.exe || { echo "::error::EXE 缺失或名称漂移（volttray-tray.exe 品牌纪元内冻结）"; exit 1; }
          test -f target/release/volttray-tray.exe.sha256.txt || { echo "::error::sha256 校验文件缺失"; exit 1; }
          # ② sha256 文件格式：64 位小写 hex + 空格 + 空格/星号 + 冻结文件名
          # （git-bash sha256sum 二进制模式输出为「空格+星号」，GNU 文本模式
          # 为「两空格」——v0.3.20 真实发布资产实测为前者，两种分隔均接受，
          # C-01：原「两空格」断言对真实资产误杀）。
          grep -Eq '^[0-9a-f]{64} [ *]volttray-tray\.exe$' target/release/volttray-tray.exe.sha256.txt \
            || { echo "::error::sha256 文件格式不符（应：64hex  space  space/asterisk  volttray-tray.exe）"; exit 1; }
          # ③ README 下载锚点不钉版本号（E2，2026-10-24 红蓝对抗终审）：
          # 每次发版后 README 的「当前最新版为 vX.Y.Z」锚点必然滞后失效；
          # 下载入口一律指向 /releases/latest，历史版本入口指向 /releases。
          # 锚点出现 releases/tag/v 即红，防止回归。
          for readme in README.md README.en-US.md; do
            if grep -q 'releases/tag/v' "$readme"; then
              echo "::error::$readme 含钉死版本号的 releases/tag/v 锚点（E2 口径：下载入口应指向 /releases/latest）"
              exit 1
            fi
          done
          echo "release-contract 全部断言通过"

      # ③ 自启注册表路径与值名文本断言——C-12 降为辅助告警：
      # 契约语义由 autostart.rs 单测锚定（run_key_contract_frozen 断言
      # RUN_KEY / RUN_VALUE_NAME 常量值，CI 绿即契约绿）；此处文本 grep
      # 只作重构时的辅助提示，合法重构（移常量/改写法）不再被阻断。
      # 命中失败时的两种出口：a) 改回代码（常量值属冻结契约，非有意不变）；
      # b) 有意变更时同步跟改本断言与 Rust 单测（同一 PR 内一并评审）。
      - name: release-contract advisory (text greps)
        shell: bash
        run: |
          grep -qF 'Software\\Microsoft\\Windows\\CurrentVersion\\Run' crates/app/src/autostart.rs \
            || echo "::warning::自启注册表路径文本未命中（autostart.rs RUN_KEY）。契约以 Rust 单测为准；若为合法重构请跟改本断言，若为误改请改回代码"
          grep -qF '"LogiVoltTray"' crates/app/src/autostart.rs \
            || echo "::warning::自启值名文本未命中（autostart.rs RUN_VALUE_NAME）。契约以 Rust 单测为准；若为合法重构请跟改本断言，若为误改请改回代码"
          echo "release-contract advisory 检查完成（仅告警，不阻断）"

      # E18（红蓝对抗终审，2026-10-24）：minisign 签名。
      # 降级策略（fail-open）：未配置 MINISIGN_SECRET_KEY 仓库密钥时跳过签名
      # 照常发布（与 T-15「未签名披露」现状兼容，SmartScreen 披露段不变）；
      # 配置后自动启用：签名产出 .minisig 资产并立刻用公钥自验（fail-closed，
      # 验不过即发布失败）。启用签名时维护者须同步把公钥提交到仓库根
      # minisign.pub（本步断言其存在），并更新 README 验证段。
      - name: minisign skipped (secret not provisioned)
        if: env.MINISIGN_SECRET_KEY == ''
        shell: bash
        run: echo "未配置 MINISIGN_SECRET_KEY：按 E18 降级策略跳过签名（fail-open），发布照常"

      # 2026-10-24 dry_run 演练实证：taiki-e/install-action 不支持 minisign
      # （windows runner 日志：does not support minisign → fallback cargo-binstall
      # 报 "no binaries specified nor inferred" 失败）。改取 jedisct1/minisign
      # 官方预编译 win64 包，sha256 钉死核验（哈希来源：发布前从官方 release
      # 资产本地下载实测，并经作者公钥 minisign 验签通过）。
      - name: install minisign
        if: env.MINISIGN_SECRET_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          ver=0.12
          zip="$RUNNER_TEMP/minisign-win64.zip"
          dest="$RUNNER_TEMP/minisign-bin"
          curl -fsSL --retry 3 -o "$zip" "https://github.com/jedisct1/minisign/releases/download/${ver}/minisign-${ver}-win64.zip"
          echo "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479  $zip" | sha256sum -c -
          mkdir -p "$dest"
          # git-bash 自带的 GNU tar（C:\Program Files\Git\usr\bin\tar.exe）不能解 zip
          # （第三轮演练实证：tar: This does not look like a tar archive）；
          # Windows 系统自带的 bsdtar（System32\tar.exe）原生支持 zip，显式调用它。
          /c/Windows/System32/tar.exe -xf "$zip" -C "$dest"
          test -x "$dest/minisign-win64/x86_64/minisign.exe"
          echo "$dest/minisign-win64/x86_64" >> "$GITHUB_PATH"
          # GITHUB_PATH 仅对后续步生效（第四轮演练实证：同步内 minisign -v
          # 报 command not found, exit 127），本步冒烟须用全路径直接调用。
          "$dest/minisign-win64/x86_64/minisign.exe" -v

      - name: minisign sign and self-verify
        if: env.MINISIGN_SECRET_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          # PATH 双保险：GITHUB_PATH 跨步生效是主路径；此处再显式补一遍
          # （cygpath 转 POSIX，避免 Windows 盘符冒号切碎 PATH），
          # 使本步不依赖跨步 PATH 传递机制的细节。
          PATH="$(cygpath -u "$RUNNER_TEMP")/minisign-bin/minisign-win64/x86_64:$PATH"
          export PATH
          minisign -v
          # 契约：启用签名必须同步提交公钥（用户验签入口，README 验证段引用）
          test -f ../minisign.pub || { echo "::error::已配置签名密钥但仓库根缺 minisign.pub 公钥——启用批次必须同步提交公钥"; exit 1; }
          key_file="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key_file"
          cd target/release
          minisign -S -s "$key_file" -p ../../../minisign.pub -m volttray-tray.exe \
            -x volttray-tray.exe.minisig -t "Logi-VoltTray release"
          rm -f "$key_file"
          # fail-closed：签名产出后立即自验，验不过即发布失败
          minisign -V -p ../../../minisign.pub -m volttray-tray.exe -x volttray-tray.exe.minisig
          echo "minisign 签名与自验通过"

      # T-05：注入最近一次 nightly 状态到 Release 说明（gh CLI 为 runner
      # 预装件，C-F4）。先落兜底文案再尝试覆盖，保证 body 文件必然存在；
      # 步级 continue-on-error + 脚本内 || true——发布时刻 API 不可用
      # 不阻塞发版（F-A9：失败信号走 N-2 开单，不走这里）。
      - name: inject nightly status into release body
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body_file="$RUNNER_TEMP/release-body.md"
          fallback='最近一次 nightly：状态读取失败（发布时刻 API 不可用）'
          printf '%s\n' "$fallback" > "$body_file" || true
          line=$(gh run list --workflow nightly.yml -L 1 \
            --json conclusion,createdAt \
            --jq '.[0] | "最近一次 nightly：\(.conclusion // "未知")（run 创建于 \(.createdAt)）"' || true)
          if [ -n "${line:-}" ]; then
            printf '%s\n' "$line" > "$body_file" || true
          fi
          echo "---- release body ----" || true
          cat "$body_file" || true

      # R1-F1 修复：append_body: true（钉版 action-gh-release@v2 原生支持，
      # 已核 action.yml 输入清单与 src/github.ts 更新路径逻辑 L560-567：
      # append_body 且两侧非空时 body = 既有 body + '\n' + workflow body）——
      # Release 已存在（维护者按惯例以 annotated tag message 建 Release）时，
      # tag message 保留为说明主体、nightly 状态行追加其后，不再被 body_path
      # 恒覆盖。注意：同一 tag 重复触发会重复追加同一行（action concat 策略
      # 固有，见其源码 revisit 注）；tag 一发一跑属预期形态，可接受。
      # E18：上传步按是否配置签名密钥分两支（files 列表是静态声明，无法用
      # 表达式拼接），资产清单差异仅在 .minisig 一项。
      # dry_run 演练：github.event.inputs 在 tag push 时为 null，
      # `null != 'true'` 恒真——正式 tag 发布行为完全不变；
      # 仅手动 dispatch 且 dry_run=true 时跳过上传（E18 演练护栏）。
      - name: upload release assets (unsigned)
        if: env.MINISIGN_SECRET_KEY == '' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-body.md
          append_body: true
          files: |
            volttray/target/release/volttray-tray.exe
            volttray/target/release/volttray-tray.exe.sha256.txt

      - name: upload release assets (signed)
        if: env.MINISIGN_SECRET_KEY != '' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-body.md
          append_body: true
          files: |
            volttray/target/release/volttray-tray.exe
            volttray/target/release/volttray-tray.exe.sha256.txt
            volttray/target/release/volttray-tray.exe.minisig
