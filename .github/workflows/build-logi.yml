name: build-logi-volttray
on:
  push:
    paths:
      # 仅参考 Python 实现变更时才跑（v0.3.0 P3-3：主工程走 rust CI，此构建不再全量触发）
      - "logi_*.py"
      - ".github/workflows/build-logi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build deps
        run: pip install pyinstaller hidapi
      - name: Build exe
        run: pyinstaller --onefile --windowed --clean --name LogiVoltTray logi_tray.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogiVoltTray-exe
          path: dist/
