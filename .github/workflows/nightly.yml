name: nightly

# T-05（实施令 P1，2026-10-20）：nightly 真实 fuzz 烟测 + 失败自动开单（N-2）
# + 30 晚到期评审。批④ 0007 与 week2/PR#5/PR#6 已合入演进融合落地：
# - fuzz 红就是信号，信号走 N-2 开单；崩溃样本 upload 挂 if: always()，
#   fuzz 步红时不得被跳过（F-A8）；
# - 「烟测≠防线」：5 分钟 smoke + RSS 2.5GB 上限的冒烟，目标是暴露构造性
#   崩溃与接线退化，不是安全防线；
# - 协议测试为真实门禁（PR#6 已合入裁决，失败即红）——0007 原设计的
#   步级 continue-on-error 不再适用，见 N-2 开单步注记；
# - 发布对账承载：docs/experience/06-release-reconciliation.md F 节（30 晚
#   时钟挂常设区，本 workflow 是时钟的数据源）；
# - P1-5：verify-selfcheck job 每晚 dry-run 自检 verify.sh（--a4 + bash -n），
#   脚本自身失效当晚暴露并按 N-2 同法开单；
# - P0-3②：pointer-drift-advisory job（report-only）每晚 grep 已知旧指针
#   模式 + E/D 编号引用存在性，防指针漂移复发。

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  issues: write # N-2：失败开单（label 精确查重 + 追加评论）
  actions: read # 30 晚到期评审读本 workflow 自身 run 历史

env:
  CARGO_TERM_COLOR: always
  # E19（红蓝对抗终审 P2b 批，2026-10-24）：T-05「30 晚」时钟起算日
  # 不再硬编码于此——单源为 docs/experience/reconciliation-clocks.yaml
  # 的 T-05 行 start 字段，30-nights 评审步启动时用 python3 标准库
  # json 解析读取（workflow 零时钟常量，承接 C-10 单源口径）。

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    # nightly 首跑红修复：rust-toolchain.toml 把工具链钉在 1.90.0，rustup
    # 目录覆盖会压过 dtolnay 的 nightly 默认——用 env 显式钉 nightly
    # （env 优先级高于 rust-toolchain.toml），一处同修 fuzz 与
    # protocol tests 两处名实不符（此前 protocol tests 实为 stable 跑）。
    env:
      RUSTUP_TOOLCHAIN: nightly
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz 需要 nightly 编译 libfuzzer；rust-src 为 cargo-fuzz
      # 夜间构建常规依赖组件，保留（实际 build 未用 -Zbuild-std——
      # 此前「rust-src 为 -Zbuild-std 插桩所需」系质检基于 musl 报错的
      # 误判，质检已自我更正）
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # E16 扩面副作用修复（2026-10-24，run 40076969587 实证）：fuzz crate
      # 新增 volttray-device/app 依赖后，包级依赖对所有 bin 生效——
      # frame_fuzz 构建也会编译 hidapi，其 build.rs 需系统库 libudev；
      # 本 job 此前只跑 protocol 无此依赖，缺装即构建失败。与 ci.yml
      # fuzz-smoke / ubuntu job 同法安装。
      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      # 协议层 nightly 回归：真实门禁，失败即红（PR#6 裁决；此前
      # continue-on-error 吞错）。批④融合注记：0007 原设计保留步级
      # continue-on-error（协议抖动不遮蔽 fuzz 信号），与已合入的真实
      # 门禁裁决冲突——按「以 main 现状为基线、不回退已合入改动」
      # 保留真实门禁；协议红与 fuzz 红均走 N-2 开单。
      - name: protocol tests on nightly
        run: cargo test -p volttray-protocol --locked

      # cargo-fuzz 固定版本安装（taiki-e/install-action，双方收敛选型，
      # 与 audit.yml 的 cargo-audit 统一）；0.13.2 = crates.io
      # max_stable_version（2026-10-20 核对）。
      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # 语料跨晚复用（F-A8 配套：语料用 cache，artifact 只留崩溃样本）。
      - name: fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: volttray/fuzz/corpus/frame_fuzz
          key: frame_fuzz-corpus-${{ github.run_id }}
          restore-keys: frame_fuzz-corpus-

      # fuzz 真跑（评审 P0-2 落地 + T-05）：frame_fuzz harness 真实执行，
      # 时长克制（5 分钟 smoke，week2 已合入口径）+ RSS 2.5GB 上限。
      # 显式钉 gnu target：taiki-e 装的是 musl 预编译版 cargo-fuzz，其
      # 默认 --target 取编译期平台即 musl，而 ASan 与 musl 静态 libc
      # 不兼容（nightly 重跑 fuzz 编译即死，质检已定位至 cargo-fuzz
      # v0.13.2 src/options.rs L101）。nightly 自带 host gnu 的
      # rust-std，glibc 动态链接与 ASan 兼容。
      - name: fuzz frame_fuzz (5min smoke)
        working-directory: volttray/fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu frame_fuzz -- -max_total_time=300 -rss_limit_mb=2560

      # 崩溃样本上传：if: always()——fuzz 步红时 upload 不得被跳过
      # （F-A8 裁决原文），否则崩溃样本在最需要时拿不到。正常晚
      # 无崩溃文件，if-no-files-found: ignore 减噪。
      - name: upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: volttray/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # N-2 开单步（任一前置步红即触发）：gh CLI 为 runner 预装件（C-F4），
      # 去重按 label 精确查（F-A6：标题仅作人类可读，不作查重键）；
      # 处置出口零天数时限（K-8）；每 issue 追加评论上限 10 条，
      # 达上限后仅计数不再追加（防噪三件套）。
      # P2 修正（R1 评审退回项，批④合入时修复）：gh issue view --json
      # comments --jq '.comments' 返回数组，须加 '| length' 取整数——
      # 否则 [ "$count" -ge 10 ] 整数比较报错（退出码 2 → if 为假），
      # 「评论上限 10 条」防噪机制失效。
      # E4（2026-10-24 红蓝对抗终审）三项修复：
      # ① 幂等化——gh label create 无 --if-not-exists flag（gh 官方
      #    manual 核对，2026-10-24），runner 上 "unknown flag" 必败，
      #    开单死在第一步 = nightly 失败静默的根因；改 --force
      #    （不存在则建、已存在则更新 color/description），幂等。
      # ② R2-F3① 闭环——FAILED_STEP 硬编码步名改为 jobs API 动态取
      #    本 job 内 conclusion == failure 的步名，步改名不须跟改。
      # ③ 开单步失效自报——set +e 手动收集 + ::error 注解 + 失败
      #    exit 1，开单步自身红时在 run 页高亮，不再静默。
      - name: N-2 open-or-comment issue (ci-nightly-failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e -uo pipefail
          errs=0
          note_err() { echo "::error::[N-2 开单步自报] $1"; errs=$((errs + 1)); }
          gh label create ci-nightly-failure \
            --color B60205 \
            --description "nightly fuzz 失败自动开单（N-2）" \
            --force \
            || note_err "gh label create ci-nightly-failure 失败"
          FAILED_STEPS=""
          steps_jq='[.jobs[] | select(.name == "'"${GITHUB_JOB}"'") | .steps[]? | select(.conclusion == "failure") | .name] | join("、")'
          if FAILED_STEPS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq "$steps_jq"); then
            [ -n "$FAILED_STEPS" ] || FAILED_STEPS="（未取到失败步名，以 run 页为准）"
          else
            FAILED_STEPS="（失败步名获取失败，以 run 页为准）"
            note_err "gh api jobs 取失败步名失败"
          fi
          if [ "$errs" -eq 0 ]; then
            num=""
            if list_json=$(gh issue list --state open --label ci-nightly-failure \
              --json number --limit 1); then
              num=$(printf '%s' "$list_json" | jq -r '.[0].number // empty')
            else
              note_err "gh issue list 查重失败"
            fi
            if [ -n "$num" ]; then
              count=$(gh issue view "$num" --json comments --jq '.comments | length')
              if [ -z "$count" ]; then
                note_err "gh issue view #${num} 取评论数失败"
              elif [ "$count" -ge 10 ]; then
                echo "[N-2] issue #${num} 评论已达上限（10），本晚失败仅计数、不再追加（防噪三件套）"
              else
                gh issue comment "$num" \
                  --body "nightly 失败（失败步：${FAILED_STEPS}）：${RUN_URL}" \
                  || note_err "gh issue comment #${num} 失败"
              fi
            else
              body=$(printf '触发步：%s\nrun：%s\n处置出口：下个发布窗口前处置并在 Release 说明标注（零天数时限）。' \
                "$FAILED_STEPS" "$RUN_URL")
              gh issue create --label ci-nightly-failure \
                --title "nightly fuzz 失败（自动开单）" \
                --body "$body" \
                || note_err "gh issue create 失败"
            fi
          fi
          if [ "$errs" -ne 0 ]; then
            echo "::error::[N-2] 开单步自身失效（${errs} 处），失败信号可能丢失，请人工核查本 run"
            exit 1
          fi

      # 「30 晚无非红」到期评审：起算日常量仅作下限，到期判据按最近
      # nightly run 的 createdAt 校核（F-A10），issue 正文写出实际
      # 运行晚数；去重同样按 label（ci-review-due）精确查。
      - name: 30-nights review-due check (ci-review-due)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # E19：起算日单源＝reconciliation-clocks.yaml T-05 行（json 解析，
          # 零依赖）；解析失败 ::error 并非 0 退出（时钟失效不得静默）。
          FUZZ_CLOCK_START=$(python3 -c "
          import json
          d = json.load(open('docs/experience/reconciliation-clocks.yaml', encoding='utf-8'))
          c = next(c for c in d['clocks'] if c['id'] == 'T-05')
          assert c['status'] == 'active' and c['start'], 'T-05 时钟非 active 或缺 start'
          print(c['start'])
          " 2>/dev/null) || { echo "::error::T-05 起算日单源解析失败——reconciliation-clocks.yaml T-05 行缺失/挂起，须人工修复（E19/C-10）"; exit 1; }
          echo "T-05 起算日（自 reconciliation-clocks.yaml 解析）：$FUZZ_CLOCK_START"
          gh label create ci-review-due \
            --color FBCA04 \
            --description "30 晚到期评审（N-2 / T-05）" \
            --force \
            || { echo "::error::[N-2 自报] gh label create ci-review-due 失败（E4：--force 幂等）"; exit 1; }
          runs_json=$(gh run list --workflow nightly.yml \
            --json conclusion,createdAt --limit 400)
          total=$(printf '%s' "$runs_json" | jq --arg start "$FUZZ_CLOCK_START" \
            '[.[] | select(.createdAt >= $start)] | length')
          green=$(printf '%s' "$runs_json" | jq --arg start "$FUZZ_CLOCK_START" \
            '[.[] | select(.conclusion == "success" and (.createdAt >= $start))] | length')
          echo "时钟起算日 $FUZZ_CLOCK_START：实际运行 ${total} 晚，其中全绿 ${green} 晚"
          if [ "$green" -lt 30 ]; then
            echo "全绿 ${green} 晚 < 30，未到期"
            exit 0
          fi
          num=$(gh issue list --state open --label ci-review-due \
            --json number --limit 1 | jq -r '.[0].number // empty')
          if [ -n "$num" ]; then
            echo "[N-2] 到期评审单已存在：#${num}，不重复开"
            exit 0
          fi
          body=$(printf 'T-05「30 晚」到期评审：自时钟起算日 %s 起实际运行 %s 晚、全绿 %s 晚（F-A10：按 run createdAt 实算，30 仅作下限）。\n处置出口：下个发布窗口前处置并在 Release 说明标注（零天数时限）。' \
            "$FUZZ_CLOCK_START" "$total" "$green")
          gh issue create --label ci-review-due \
            --title "30 晚到期评审：nightly fuzz 无非红（自动开单）" \
            --body "$body" \
            || { echo "::error::[N-2 自报] 到期评审开单失败（E4：开单步失效不静默）"; exit 1; }

  # P1-5（C1 冲突三裁决选 A：机械可及的先机械）：门禁脚本自身失效
  # 如何被发现——本 job 每晚对 verify.sh 做干跑自检：① bash -n 语法
  # 检查；② 实跑 --a4 独立模式（A4 哈希双算：tomllib 结构路 + awk
  # 文本路，见 verify.sh a4_check）。失效当晚 job 红、按 N-2 同法
  # 自动开单——脚本失效不依赖人来发现。
  # C-06（fail-closed）：SKIP 静默绿已废止——自检的全部存在理由是反
  # E31「门禁存在≠门禁在跑」，SKIP 绿等于把 E31 请回自检自身。本 job
  # 以 python≥3.11 为前提断言（tomllib 为标准库），--a4 走 --strict：
  # python 缺席 / 无 tomllib 即 ::error 并非 0 退出。宣称限定：本 job
  # 暴露面＝**A4 子集失效当晚暴露**，不宣称覆盖 verify.sh 全部功能失效。
  verify-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: bash -n verify.sh

      # C-06 前提断言：python≥3.11（tomllib 标准库）。不满足即红，
      # 不让 --a4 走到 SKIP 分支。
      - name: assert python >= 3.11 (fail-closed precondition)
        run: |
          python3 - <<'PYEOF'
          import sys
          assert sys.version_info >= (3, 11), \
              f"python {sys.version.split()[0]} < 3.11，tomllib 不可用（C-06 前提断言失败）"
          print(f"python {sys.version.split()[0]} >= 3.11，C-06 前提满足")
          PYEOF

      - name: verify.sh --a4 dry-run (fail-closed)
        run: bash verify.sh --a4 --strict

      # N-2 同法开单（label 精确查重 + 评论上限 10 条防噪）。
      # E4（2026-10-24 终审）同步三修：--if-not-exists → --force（gh 无该
      # flag，nightly 失败静默同根因）；失败步名 jobs API 动态取；
      # 开单步失效自报（::error 注解 + 失败 exit 1）。
      - name: N-2 open-or-comment issue (verify-selfcheck-failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e -uo pipefail
          errs=0
          note_err() { echo "::error::[N-2 开单步自报] $1"; errs=$((errs + 1)); }
          gh label create verify-selfcheck-failure \
            --color B60205 \
            --description "verify.sh 自检失效自动开单（P1-5）" \
            --force \
            || note_err "gh label create verify-selfcheck-failure 失败"
          FAILED_STEPS=""
          steps_jq='[.jobs[] | select(.name == "'"${GITHUB_JOB}"'") | .steps[]? | select(.conclusion == "failure") | .name] | join("、")'
          if FAILED_STEPS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq "$steps_jq"); then
            [ -n "$FAILED_STEPS" ] || FAILED_STEPS="（未取到失败步名，以 run 页为准）"
          else
            FAILED_STEPS="（失败步名获取失败，以 run 页为准）"
            note_err "gh api jobs 取失败步名失败"
          fi
          if [ "$errs" -eq 0 ]; then
            num=""
            if list_json=$(gh issue list --state open --label verify-selfcheck-failure \
              --json number --limit 1); then
              num=$(printf '%s' "$list_json" | jq -r '.[0].number // empty')
            else
              note_err "gh issue list 查重失败"
            fi
            if [ -n "$num" ]; then
              count=$(gh issue view "$num" --json comments --jq '.comments | length')
              if [ -z "$count" ]; then
                note_err "gh issue view #${num} 取评论数失败"
              elif [ "$count" -ge 10 ]; then
                echo "[N-2] issue #${num} 评论已达上限（10），本次失效仅计数、不再追加（防噪三件套）"
              else
                gh issue comment "$num" \
                  --body "verify.sh 自检失效（失败步：${FAILED_STEPS}）：${RUN_URL}" \
                  || note_err "gh issue comment #${num} 失败"
              fi
            else
              body=$(printf '触发步：%s\nrun：%s\n处置出口：下个发布窗口前处置并在 Release 说明标注（零天数时限）。' \
                "$FAILED_STEPS" "$RUN_URL")
              gh issue create --label verify-selfcheck-failure \
                --title "verify.sh 自检失效（自动开单）" \
                --body "$body" \
                || note_err "gh issue create 失败"
            fi
          fi
          if [ "$errs" -ne 0 ]; then
            echo "::error::[N-2] 开单步自身失效（${errs} 处），失败信号可能丢失，请人工核查本 run"
            exit 1
          fi

  # P0-3② 指针漂移防复发 advisory：仿 ci.yml actionlint 步
  # continue-on-error 提示先例（C-F6）。E4（2026-10-24 终审）升级：
  # 「红不阻断」保持（阻断形态缓行，job 仍绿、run 不被拦），但命中
  # 不再仅靠人工翻 run 页——转红即按 N-2 同法自动开单（label 精确
  # 查重 + 评论上限 10 条），与「连续两晚红再人工定性是否真实漂移」
  # 口径衔接。
  # 不建链接可达性检查（C1 稿明确排除）。检查逻辑 2026-10-22 在本地
  # 快照实测：当前树零命中（旧指针/缺失 E/D 引用均 0），并经注入旧
  # 指针、E99 假引用反向自证可捕获。检查项：
  # ① 全仓 grep 已知旧指针模式——对账/F 节曾承载于 03 文档、已整体
  #    迁移至 06，旧表述（如「03-release-quality-gate.md F 节」「03
  #    文档 F 节」）复现即报；描述搬迁史的行（含「搬迁/迁移/06」字样）
  #    不报，已知豁免。
  # ② E 编号引用存在性——docs/experience、README、README.en-US.md、
  #    AGENTS.md、volttray/RELEASES.md 中引用的 E 编号，须在 01/02 的
  #    `## E数字.` 标题或 docs/experience/README.md 映射表（E15 定义于
  #    04 §8，由映射表收录）有定义。
  # ③ D 编号引用存在性——引用的 D-NN 须在 volttray/docs/decisions.md
  #    表中存在（2026-10-22 基线：D-01–D-83）。
  # ④ 节/编号唯一性（C-02）——03 门禁表的 D 编号（`| D数字` 首列）与
  #    `## 大写字母.` 节标题不得重复：存在性检查只查「有没有」，双 D8 /
  #    双 G 节撞号对①–③不可见，唯一性须单独断言。
  pointer-drift-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # E4：job 级 continue-on-error 下移到本步——步红不阻断 job，
      # 但 outcome 记为 failure 供下方开单步判定（job 级形态下
      # 后续步的 failure() 语义不可靠，steps.<id>.outcome 才确定）。
      - name: old-pointer grep + E/D reference existence (report-only)
        id: drift-check
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          echo "── ① 已知旧指针模式 ──"
          # 两段式（同行须同时命中 pat_a 与 pat_b 才算旧指针）：
          # pat_a/pat_b 分行定义，避免本 job 自身的模式文本自匹配。
          pat_a='03-release-quality-gate(\.md)?|03 文档|（03'
          pat_b='F(\.[0-9])? ?节|对账'
          old_hits=$(grep -rnE "$pat_a" \
            --include='*.md' --include='*.yml' --include='*.sh' . \
            | grep -E "$pat_b" \
            | grep -v '06-release-reconciliation' \
            | grep -vE '搬迁|迁移|曾承载' || true)
          if [ -n "$old_hits" ]; then
            printf '%s\n' "$old_hits"
            fail=1
          else
            echo "（无命中）"
          fi
          echo "── ② E 编号引用存在性 ──"
          defs_E=$( { grep -rhoE '^## E[0-9]+\.' docs/experience/01-engineering-lessons.md docs/experience/02-collaboration-playbook.md | grep -oE 'E[0-9]+' ; \
            grep -hoE '^\| E[0-9]+ \|' docs/experience/README.md | grep -oE 'E[0-9]+' ; } | sort -u)
          refs_E=$(grep -rhoE '\bE[0-9]+\b' docs/experience README.md README.en-US.md AGENTS.md volttray/RELEASES.md 2>/dev/null | sort -u)
          missing_E=$(comm -13 <(printf '%s\n' "$defs_E") <(printf '%s\n' "$refs_E"))
          echo "定义 $(printf '%s\n' "$defs_E" | wc -l) 条；引用 $(printf '%s\n' "$refs_E" | wc -l) 个编号"
          if [ -n "$missing_E" ]; then
            echo "缺失定义：$(printf '%s ' $missing_E)"
            fail=1
          else
            echo "（引用全部有定义）"
          fi
          echo "── ③ D 编号引用存在性 ──"
          defs_D=$(grep -oE '^\| D-[0-9]+' volttray/docs/decisions.md | grep -oE 'D-[0-9]+' | sort -u)
          refs_D=$(grep -rhoE '\bD-[0-9]+\b' docs/experience README.md README.en-US.md AGENTS.md volttray/RELEASES.md volttray/docs/decisions.md 2>/dev/null | sort -u)
          missing_D=$(comm -13 <(printf '%s\n' "$defs_D") <(printf '%s\n' "$refs_D"))
          echo "定义 $(printf '%s\n' "$defs_D" | wc -l) 条；引用 $(printf '%s\n' "$refs_D" | wc -l) 个编号"
          if [ -n "$missing_D" ]; then
            echo "缺失定义：$(printf '%s ' $missing_D)"
            fail=1
          else
            echo "（引用全部有定义）"
          fi
          echo "── ④ 节/编号唯一性（03 门禁表，C-02）──"
          # D 编号唯一：`^| D数字` 首列不得重复（防双 D8 撞号）
          dup_D=$(grep -oE '^\| D[0-9]+' docs/experience/03-release-quality-gate.md | sort | uniq -d || true)
          # 节标题唯一：`## 大写字母.` 不得重复（防双 G 节撞号）
          dup_sec=$(grep -oE '^## [A-Z]\.' docs/experience/03-release-quality-gate.md | sort | uniq -d || true)
          if [ -n "$dup_D" ] || [ -n "$dup_sec" ]; then
            [ -n "$dup_D" ] && echo "重复 D 编号：$(printf '%s ' $dup_D)"
            [ -n "$dup_sec" ] && echo "重复节标题：$(printf '%s ' $dup_sec)"
            fail=1
          else
            echo "（D 编号与节标题均唯一）"
          fi
          echo "── 结果：fail=${fail}（report-only，不阻断）──"
          exit $fail

      # E4（2026-10-24 终审）：advisory 转红即开单。步名不动态取——本步
      # 级 continue-on-error 时 drift-check 在 jobs API 里 conclusion 为
      # success（outcome 不进 API），动态取必空，故正文直接写检查名。
      # 开单法与 fuzz job 相同：label --force 幂等 + 精确查重 + 评论上限
      # 10 条防噪 + 开单步失效自报（::error 注解 + 失败 exit 1）。
      - name: N-2 open-or-comment issue (ci-advisory-failure)
        if: steps.drift-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e -uo pipefail
          errs=0
          note_err() { echo "::error::[N-2 开单步自报] $1"; errs=$((errs + 1)); }
          gh label create ci-advisory-failure \
            --color D93F0B \
            --description "pointer-drift advisory 命中自动开单（E4）" \
            --force \
            || note_err "gh label create ci-advisory-failure 失败"
          if [ "$errs" -eq 0 ]; then
            num=""
            if list_json=$(gh issue list --state open --label ci-advisory-failure \
              --json number --limit 1); then
              num=$(printf '%s' "$list_json" | jq -r '.[0].number // empty')
            else
              note_err "gh issue list 查重失败"
            fi
            if [ -n "$num" ]; then
              count=$(gh issue view "$num" --json comments --jq '.comments | length')
              if [ -z "$count" ]; then
                note_err "gh issue view #${num} 取评论数失败"
              elif [ "$count" -ge 10 ]; then
                echo "[N-2] issue #${num} 评论已达上限（10），本次命中仅计数、不再追加（防噪三件套）"
              else
                gh issue comment "$num" \
                  --body "pointer-drift advisory 命中（①–④ 任一项，run 页见明细）：${RUN_URL}" \
                  || note_err "gh issue comment #${num} 失败"
              fi
            else
              body=$(printf '触发：pointer-drift advisory 检查命中（①旧指针 / ②E 编号 / ③D 编号 / ④唯一性，run 页见明细）。\n定性口径：连续两晚红再人工定性是否真实漂移。\nrun：%s\n处置出口：下个发布窗口前处置并在 Release 说明标注。' \
                "$RUN_URL")
              gh issue create --label ci-advisory-failure \
                --title "pointer-drift advisory 命中（自动开单）" \
                --body "$body" \
                || note_err "gh issue create 失败"
            fi
          fi
          if [ "$errs" -ne 0 ]; then
            echo "::error::[N-2] 开单步自身失效（${errs} 处），advisory 命中信号可能丢失，请人工核查本 run"
            exit 1
          fi
