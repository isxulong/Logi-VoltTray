name: nightly

# 评审 P0-2：ubuntu + nightly 的 fuzz / 覆盖率 job。
# 第 2 波（week2-ci-hardening）：fuzz 从 echo 占位升级为真实 cargo-fuzz
# 短跑（volttray/fuzz 既有 frame_fuzz harness），并摘掉 continue-on-error
# 空转口径——job 失败即真红，不再吞错。
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    # nightly 首跑红修复：rust-toolchain.toml 把工具链钉在 1.90.0，rustup
    # 目录覆盖会压过 dtolnay 的 nightly 默认——用 env 显式钉 nightly
    # （env 优先级高于 rust-toolchain.toml），一处同修 fuzz 与
    # protocol tests 两处名实不符（此前 protocol tests 实为 stable 跑）。
    env:
      RUSTUP_TOOLCHAIN: nightly
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz 需要 nightly 编译 libfuzzer；rust-src 为 cargo-fuzz
      # 夜间构建常规依赖组件，保留（实际 build 未用 -Zbuild-std——
      # 此前「rust-src 为 -Zbuild-std 插桩所需」系质检基于 musl 报错的
      # 误判，质检已自我更正）
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # 协议层 nightly 回归：真实门禁，失败即红（此前 continue-on-error 吞错）
      - name: protocol tests on nightly
        run: cargo test -p volttray-protocol --locked

      # fuzz 真跑（评审 P0-2 落地）：frame_fuzz harness 真实执行，时长克制
      # （5 分钟 smoke）；发现 crash 时 cargo-fuzz 非零退出 → job 红
      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # 显式钉 gnu target：taiki-e 装的是 musl 预编译版 cargo-fuzz，其
      # 默认 --target 取编译期平台即 musl，而 ASan 与 musl 静态 libc
      # 不兼容（nightly 重跑 fuzz 编译即死，质检已定位至 cargo-fuzz
      # v0.13.2 src/options.rs L101）。nightly 自带 host gnu 的
      # rust-std，glibc 动态链接与 ASan 兼容。
      - name: fuzz frame_fuzz (5min smoke)
        working-directory: volttray/fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu frame_fuzz -- -max_total_time=300

      # crash 时上传统料/最小化用例，供离线复现（与 ci.yml 失败日志口径一致）
      - name: upload fuzz artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: volttray/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
