name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# fmt 自动回推需要写权限（github-actions[bot] 提交格式化结果）
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # 可复现构建：工具链锁定 1.90.0（与 rust-toolchain.toml 一致，见 docs/decisions.md D-01）
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray
          # v0.3.1：burst 推送期多 run 并发恢复旧缓存、产物 mtime 被置为恢复时刻，
          # cargo 误判 fresh 跳过重编译（跑出旧二进制/旧测试集）。prefixKey 随版本
          # 递增以强制全量重编译，保证 CI 证据与源码一致。
          prefix-key: v0.3.1

      # 自动格式化并回推：cargo fmt 修平差异后提交回 main（HEAD:main 推送避免 detached HEAD 问题），
      # 无差异则跳过；随后 fmt --check 作为最终守卫
      - name: fmt (auto-fix)
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "fmt clean, nothing to push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply cargo fmt (CI auto-fix)"
            git push origin HEAD:main
          fi

      - name: fmt --check
        run: cargo fmt --all -- --check

      # 可复现构建（评审 P0-2）：Cargo.lock 已入库，clippy/test/build 一律 --locked
      # clippy/test/build 输出落盘，失败时上传为 artifact 供离线排查（日志 API 无权限）
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../clippy.log

      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../test.log

      - name: build release
        run: cargo build --release --locked -p volttray-tray

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: volttray-tray-exe
          path: volttray/target/release/volttray-tray.exe
          if-no-files-found: error

      - name: upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            clippy.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
