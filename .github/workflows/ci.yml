name: ci

on:
  push:
    branches: [main]
  # v0.3.17（一轮 P0-②）：PR 同门禁（此前仅 push main 触发，PR 零验证）
  pull_request: {}
  workflow_dispatch: {}
  # R1 发布门禁：允许 release.yml 以 workflow_call 复用本门禁作为发布前置
  workflow_call: {}

# v0.3.17（一轮 P0-②）：fmt 不再自动回推，CI 无任何写权限需求
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # 可复现构建：工具链锁定 1.90.0（与 rust-toolchain.toml 一致，见 docs/decisions.md D-01）
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      # v0.3.17（一轮 P0-②）：fmt 改纯检查——check 失败由作者本地
      # cargo fmt 修（消除 bot 直推 main 的写权限面与「bot 提交再次
      # 触发 CI」的循环风险）。
      - name: fmt --check
        run: cargo fmt --all -- --check

      # 可复现构建（评审 P0-2）：Cargo.lock 已入库，clippy/test/build 一律 --locked
      # clippy/test/build 输出落盘，失败时上传为 artifact 供离线排查（日志 API 无权限）
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../clippy.log

      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../test.log

      # 相位二（第 7 项）：门禁健康断言——协议冻结对照基线（red/）与
      # golden 向量目录存在且非空，防目录漂移致冻结门禁空转（RED_DIR
      # 指错类问题已于 v0.3.17 修复，此处为持续健康检查）。
      - name: gate health (vectors present)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test -d red || { echo "::error::red/ 对照基线目录缺失"; exit 1; }
          test -d volttray/fixtures/golden || { echo "::error::golden 向量目录缺失"; exit 1; }
          n=$(find volttray/fixtures/golden -type f | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::golden 向量目录为空"; exit 1; }
          echo "golden 向量文件数：$n"
          echo "向量目录最近提交时间：$(git log -1 --format='%ci' -- red volttray/fixtures/golden)"

      # v0.3.17（一轮 P0-④）：协议冻结门禁纳入 CI（Python 单侧，仓库根
      # 执行；tests/_winstub.py 提供 hid 桩，windows runner 自带 python）
      - name: protocol freeze (python unittest)
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: build release
        run: cargo build --release --locked -p volttray-tray

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: volttray-tray-exe
          path: volttray/target/release/volttray-tray.exe
          if-no-files-found: error

      - name: upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            clippy.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

  # 第 2 波（week2-ci-hardening）：Ubuntu 门禁——与 windows job 并行，
  # fmt/clippy/test 全集，消除单平台盲区（tray 的 Windows-only 依赖均在
  # cfg(windows) 下门控，workspace 跨平台可编译）。
  ubuntu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # ubuntu 首跑实证（PR #2 CI）：transport 默认特性 hid 把 optional
      # hidapi 拉入全平台构建，其 build.rs 需要系统库 libudev——windows-only
      # CI 的盲区，新门禁立功。方案 A：安装系统依赖，留在本波纯 CI 配置范围；
      # transport 特性门控优化（方案 B）属代码级改动，记入后续波次。
      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      - name: fmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../clippy-ubuntu.log

      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../test-ubuntu.log

      # 相位二（第 2 项）：windows-target 构建门禁——tray crate 的
      # cfg(windows) 代码（settings/bootlog 等模块）在 Linux check 中
      # 不参与编译（D-75 类「从未在 Windows 编译过」盲区）；ubuntu job
      # 补 mingw 交叉 check，把该盲区从 windows runner 首编译前移。
      - name: install mingw cross toolchain
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: rustup target add x86_64-pc-windows-gnu
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (windows target)
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --locked --target x86_64-pc-windows-gnu 2>&1 | tee ../check-windows-target.log

      # E1（2026-10-24 红蓝对抗终审）：src 文本纯净性断言——诊断导出/日志
      # 相关源码若混入 NUL 字节或非法编码字节，会被 grep 判为二进制，
      # 依赖 grep 的下游守卫（见 redline-guard-advisory 注释）将静默漏检。
      # 勘误（2026-10-24 字节级实测）：此前「tray/src/main.rs 含会被 grep
      # 误判为二进制的字节序列，不加 -a 会漏 8 处」的说法系当时本地沙箱
      # 网络盘短读伪影——对 main.rs / settings.rs / core.rs 逐字节扫描
      # （NUL、控制字符、UTF-8 合法性）均干净且与远端 blob 一致，GNU
      # grep 对文件内容的判定是确定的，本断言无 flaky 风险。发现判二进制
      # 即红，防真实字节污染回归。
      - name: src files must not be judged binary (E1)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! [ -s "$f" ]; then
              echo "::error::$f 为空文件（源码文件不应为空）"
              fail=1
              continue
            fi
            # grep -I：二进制文件按「无匹配」处理——纯文本必命中 '.'，
            # 含 NUL/坏编码字节的文件被判二进制后 -q 返回 1。
            if ! grep -Iq . "$f"; then
              echo "::error::$f 被 grep 判为二进制（E1：疑似混入 NUL 或非法编码字节，需字节级排查）"
              fail=1
            fi
          done < <(find volttray -name '*.rs' -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "E1 断言通过：$count 个 .rs 源文件均为纯文本（grep -I 判定）"

      - name: upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-ubuntu
          path: |
            clippy-ubuntu.log
            test-ubuntu.log
            check-windows-target.log
          if-no-files-found: ignore
          retention-days: 7

      # 第 0 步（实施令裁决）：actionlint 提示模式——先跑完本期、实测误报率后再
      # 评审升必过（评审项已登记进 docs/experience/06-release-reconciliation.md F.1 常设区）。
      - name: actionlint (advisory mode)
        uses: raven-actions/actionlint@v2
        continue-on-error: true

  # P2-7 红线守卫（C1 冲突一裁决：红线核验先 advisory——静态模式检查
  # report-only 挂 CI，不阻断；统计口径与升级条件登记于
  # docs/experience/03-release-quality-gate.md「红线守卫（advisory）」节）。
  # 检查对象：volttray/crates 内删除类调用（std::fs::remove_file /
  # remove_dir / remove_dir_all，红线 E20「绝不自动删除用户文件」）：
  # ① 裸调用——未以 `let _ =` 兜底形态出现；
  # ② 用户路径命中——删除调用同行参数含 config_dir / data_dir /
  #    home_dir / 用户 等用户文件路径特征。
  # 基线（2026-10-22 本地实测）：54 处删除类调用，全部 `let _ =` 兜底，
  # ①② 均 0 命中。「拦截 v0.3.9 类 P1」为未验证的候选收益（C1 稿原文
  # 口径，不写成实测）。
  # E16（2026-10-24 终审，A-R9 按 F-BvA-6 修正）：fuzz 扩面三处
  # （battery/stats/config 解析）＋ PR 级阻断烟测。报告口径原文
  # 「第一版挂 PR 级 5 分钟阻断烟测（信号链修复前不进 nightly）」——
  # 故挂 ci.yml（PR 同门禁）而非 nightly.yml；真实门禁、失败即红
  # （无 continue-on-error）。三目标各 100 秒 ≈ 5 分钟总量。
  # 环境口径与 nightly fuzz-smoke 一致：nightly 显式钉（RUSTUP_TOOLCHAIN
  # 压过 rust-toolchain.toml）、rust-src、taiki-e cargo-fuzz@0.13.2、
  # 显式 gnu target（taiki-e musl 版默认 target 与 ASan 不兼容，
  # nightly 首跑已实证）。libudev：device/app 经 transport 默认特性
  # 拉入 hidapi，同 ubuntu job 需系统库。
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # PR 级烟测不挂语料缓存（语料复用属 nightly 职责，F-A8）；
      # 每目标 100 秒空语料起跑即足够暴露构造性崩溃与接线退化。
      - name: fuzz smoke (3 targets x 100s, blocking)
        working-directory: volttray/fuzz
        shell: bash
        run: |
          set -euo pipefail
          for t in battery_fuzz stats_fuzz config_fuzz; do
            echo "── fuzz $t (100s) ──"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=100 -rss_limit_mb=2560
          done

      # 崩溃样本上传：if: always()（F-A8：fuzz 步红时不得被跳过）。
      - name: upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-pr-artifacts
          path: volttray/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  redline-guard-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # grep -a：tray/src/main.rs 含会被 grep 误判为二进制的字节序列，
      # 不加 -a 会漏 8 处（2026-10-22 实测教训，已计入统计口径）。
      - name: deletion-call static pattern check (report-only)
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          hits=$(grep -ran 'remove_file\|remove_dir' volttray/crates --include='*.rs' || true)
          total=$(printf '%s\n' "$hits" | grep -c .)
          bare=$(printf '%s\n' "$hits" | grep -v 'let _ =' || true)
          userpath=$(printf '%s\n' "$hits" | grep -iE 'config_dir|data_dir|home_dir|用户' || true)
          echo "删除类调用总数：${total}（基线 54，2026-10-22 实测）"
          if [ -n "$bare" ]; then
            echo "── ① 裸调用（无 let _ = 兜底）──"
            printf '%s\n' "$bare"
            fail=1
          else
            echo "① 裸调用：0 命中"
          fi
          if [ -n "$userpath" ]; then
            echo "── ② 删除调用命中用户文件路径特征 ──"
            printf '%s\n' "$userpath"
            fail=1
          else
            echo "② 用户路径命中：0 命中"
          fi
          echo "── 结果：fail=${fail}（report-only，不阻断；命中后人工复核，多行续行属已知误报源）──"
          exit $fail
