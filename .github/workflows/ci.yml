name: ci

on:
  push:
    branches: [main]
  # v0.3.17（一轮 P0-②）：PR 同门禁（此前仅 push main 触发，PR 零验证）
  pull_request: {}
  workflow_dispatch: {}
  # R1 发布门禁：允许 release.yml 以 workflow_call 复用本门禁作为发布前置
  workflow_call: {}

# v0.3.17（一轮 P0-②）：fmt 不再自动回推，CI 无任何写权限需求
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # 可复现构建：工具链锁定 1.90.0（与 rust-toolchain.toml 一致，见 docs/decisions.md D-01）
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      # v0.3.17（一轮 P0-②）：fmt 改纯检查——check 失败由作者本地
      # cargo fmt 修（消除 bot 直推 main 的写权限面与「bot 提交再次
      # 触发 CI」的循环风险）。
      - name: fmt --check
        run: cargo fmt --all -- --check

      # 可复现构建（评审 P0-2）：Cargo.lock 已入库，clippy/test/build 一律 --locked
      # clippy/test/build 输出落盘，失败时上传为 artifact 供离线排查（日志 API 无权限）
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../clippy.log

      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../test.log

      # 相位二（第 7 项）：门禁健康断言——协议冻结对照基线（red/）与
      # golden 向量目录存在且非空，防目录漂移致冻结门禁空转（RED_DIR
      # 指错类问题已于 v0.3.17 修复，此处为持续健康检查）。
      - name: gate health (vectors present)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test -d red || { echo "::error::red/ 对照基线目录缺失"; exit 1; }
          test -d volttray/fixtures/golden || { echo "::error::golden 向量目录缺失"; exit 1; }
          n=$(find volttray/fixtures/golden -type f | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::golden 向量目录为空"; exit 1; }
          echo "golden 向量文件数：$n"
          echo "向量目录最近提交时间：$(git log -1 --format='%ci' -- red volttray/fixtures/golden)"

      # v0.3.17（一轮 P0-④）：协议冻结门禁纳入 CI（Python 单侧，仓库根
      # 执行；tests/_winstub.py 提供 hid 桩，windows runner 自带 python）
      - name: protocol freeze (python unittest)
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      # 组7 G-35 / 组8 N-06/N-07/N-13（2026-10-31 红蓝对抗修复波三）：
      # 文档锚点静态断言 + E18 三件套裸值禁令（pwsh 冒烟——AvB P2-2
      # 修正落点：实读锚点为 windows-latest 链，不预设 ubuntu job）。
      # 断言分两层：①硬断言——main 既有锚点（POLL_CHARGING 常量、
      # E18 三件套标记、N-06/N-07/N-13 文档锚点）缺失即红；
      # ②在场门控——PR #19（IMPL-CORE）合入后才存在的诊断计数器
      # 字段，未合入时显式 skip 并打印提示，合入后自动升级为硬校验。
      - name: docs anchors smoke (G-35/N-06/N-07/N-13, pwsh)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $fail = 0
          function Err($msg) { Write-Host "::error::$msg"; $script:fail = 1 }
          function Ok($msg) { Write-Host "[ok] $msg" }

          # --- G-35: E18 三件套块在场、锚点齐、不含实测裸值形态 ---
          $e18 = Get-Content docs/experience/01-engineering-lessons.md -Raw
          $m = [regex]::Match($e18, '(?s)<!-- G-35 三件套 begin -->(.*?)<!-- G-35 三件套 end -->')
          if (-not $m.Success) { Err 'E18 三件套标记缺失（G-35）' }
          else {
            $blk = $m.Groups[1].Value
            if ([regex]::IsMatch($blk, '\d+\s*(毫秒|秒|分钟|小时|帧|MB|KB|Hz)')) {
              Err 'E18 三件套块含实测裸值形态（裸值只进 N-04/N-05 定位记录，不进正文）'
            } else { Ok 'E18 三件套块无实测裸值形态' }
            foreach ($a in '32e8367', '93e28a9b', 'POLL_CHARGING', 'poll_rounds_total', '--tier-audit') {
              if ($blk -notmatch [regex]::Escape($a)) { Err "E18 三件套缺锚点：$a" }
            }
            Ok 'E18 三件套锚点齐（口径/取数命令/锚定 commit）'
          }

          # --- G-35: main 既有常量锚点（硬断言）---
          if (-not (Select-String -Path volttray/crates/app/src/core.rs -Pattern 'POLL_CHARGING' -Quiet)) {
            Err 'core.rs 缺 POLL_CHARGING 常量锚点'
          } else { Ok 'POLL_CHARGING 常量锚点在场' }

          # --- G-35: IMPL-CORE 计数器在场门控（#19 未合入 skip，合入后硬校验）---
          $diag = 'volttray/crates/app/src/diag_export.rs'
          if ((Test-Path $diag) -and (Select-String -Path $diag -Pattern 'poll_rounds_total' -Quiet)) {
            foreach ($c in 'poll_round_last_duration_ms', 'poll_round_max_duration_ms', 'slot_outcome_success', 'slot_outcome_timeout', 'slot_outcome_error', 'slot_query_charging', 'slot_query_normal', 'poll_skipped_ff_cache', 'poll_skipped_dead_slot', 'poll_skipped_sleep') {
              if (-not (Select-String -Path $diag -Pattern $c -Quiet)) { Err "diag_export.rs 缺计数器字段：$c" }
            }
            Ok 'IMPL-CORE 计数器字段全部在场（在场门控升级为硬校验）'
          } else {
            Write-Host '[skip] poll_rounds_total 未在场（PR #19 未合入）——IMPL-CORE 计数器校验 deferred，合入后自动生效'
          }

          # --- N-06: README / 04-onboarding 折叠计数口径锚点 ---
          foreach ($f in 'README.md', 'docs/experience/04-onboarding.md') {
            if (-not (Select-String -Path $f -Pattern 'suppressed' -Quiet)) { Err "$f 缺 suppressed 折叠计数口径（N-06）" }
            elseif (-not (Select-String -Path $f -Pattern '诊断导出.*计数器|诊断计数器' -Quiet)) { Err "$f 缺「以诊断计数器为准」口径（N-06）" }
            else { Ok "$f N-06 锚点在场" }
          }

          # --- N-07: 发布检查单双设备实测条目 ---
          if (-not (Select-String -Path docs/experience/03-release-quality-gate.md -Pattern '双设备' -Quiet)) {
            Err '03 发布检查单缺双设备实测条目（N-07）'
          } else { Ok '03 发布检查单双设备条目在场' }

          # --- N-13: decisions.md D-99 定位结论锚点 ---
          $dec = Get-Content volttray/docs/decisions.md -Raw
          foreach ($a in 'D-99', '58b1bd23') {
            if ($dec -notmatch [regex]::Escape($a)) { Err "decisions.md 缺 N-13 锚点：$a" }
          }
          Ok 'decisions.md D-99 N-13 定位结论在场'

          if ($fail -ne 0) { exit 1 }
          Write-Host 'docs anchors smoke 全部通过'

      - name: build release
        run: cargo build --release --locked -p volttray-tray

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: volttray-tray-exe
          path: volttray/target/release/volttray-tray.exe
          if-no-files-found: error

      - name: upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            clippy.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

  # 第 2 波（week2-ci-hardening）：Ubuntu 门禁——与 windows job 并行，
  # fmt/clippy/test 全集，消除单平台盲区（tray 的 Windows-only 依赖均在
  # cfg(windows) 下门控，workspace 跨平台可编译）。
  ubuntu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # ubuntu 首跑实证（PR #2 CI）：transport 默认特性 hid 把 optional
      # hidapi 拉入全平台构建，其 build.rs 需要系统库 libudev——windows-only
      # CI 的盲区，新门禁立功。方案 A：安装系统依赖，留在本波纯 CI 配置范围；
      # transport 特性门控优化（方案 B）属代码级改动，记入后续波次。
      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      - name: fmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../clippy-ubuntu.log

      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../test-ubuntu.log

      # 相位二（第 2 项）：windows-target 构建门禁——tray crate 的
      # cfg(windows) 代码（settings/bootlog 等模块）在 Linux check 中
      # 不参与编译（D-75 类「从未在 Windows 编译过」盲区）；ubuntu job
      # 补 mingw 交叉 check，把该盲区从 windows runner 首编译前移。
      - name: install mingw cross toolchain
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: rustup target add x86_64-pc-windows-gnu
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (windows target)
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --locked --target x86_64-pc-windows-gnu 2>&1 | tee ../check-windows-target.log

      # E1（2026-10-24 红蓝对抗终审）：src 文本纯净性断言——诊断导出/日志
      # 相关源码若混入 NUL 字节或非法编码字节，会被 grep 判为二进制，
      # 依赖 grep 的下游守卫（见 redline-guard-advisory 注释）将静默漏检。
      # 勘误（2026-10-24 字节级实测；G-31 统一口径 2026-10-31）：此前
      # 「tray/src/main.rs 含会被 grep 误判为二进制的字节序列，不加 -a
      # 会漏 8 处」的说法系当时本地沙箱网络盘 SEEK_HOLE 语义所致的读路径
      # 伪影——对 main.rs / settings.rs / core.rs 逐字节扫描（NUL、控制
      # 字符、UTF-8 合法性）均干净，满读 md5 与远端 blob 一致、无短读。
      # 教训：grep 的二进制判定依赖读路径 / FS 语义，发现判二进制先换
      # 文件系统复判；本断言跑在 CI 稳定 FS 上、无 flaky 风险，复判一致
      # 即红，防真实字节污染回归。
      - name: src files must not be judged binary (E1)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! [ -s "$f" ]; then
              echo "::error::$f 为空文件（源码文件不应为空）"
              fail=1
              continue
            fi
            # grep -I：二进制文件按「无匹配」处理——纯文本必命中 '.'，
            # 含 NUL/坏编码字节的文件被判二进制后 -q 返回 1。
            if ! grep -Iq . "$f"; then
              echo "::error::$f 被 grep 判为二进制（E1：疑似混入 NUL 或非法编码字节，需字节级排查）"
              fail=1
            fi
          done < <(find volttray -name '*.rs' -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "E1 断言通过：$count 个 .rs 源文件均为纯文本（grep -I 判定）"

      - name: upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-ubuntu
          path: |
            clippy-ubuntu.log
            test-ubuntu.log
            check-windows-target.log
          if-no-files-found: ignore
          retention-days: 7

      # actionlint 已于 2026-10-27 升必过（维护者授权主 AD 裁定；依据：v0.3.22–v0.3.24
      # 三个发布窗口实测零告警、误报率为零；留痕见 docs/experience/06-release-reconciliation.md F.1/F.2）。
      - name: actionlint
        uses: raven-actions/actionlint@v2

  # E20（红蓝对抗终审 P2b 批，2026-10-24）：纯逻辑链 criterion 微基准进 CI。
  # 首版口径（终审报告 E20 条目原文）：只跑数、不设阈值门禁——先把三条
  # 纯逻辑链（frame 编解码 / 脱敏 / stats JSONL）的基线数字跑进 CI 日志，
  # 阈值与回归门禁待积累若干轮基线后另行评审。bench 编译失败或运行
  # 崩溃仍会令本 job 变红（这是代码正确性信号，不是性能信号）。
  # 测量参数收窄（measurement-time 1s / warm-up 0.5s / sample-size 10），
  # 单次约 10 秒内跑完，不拖慢 CI 关键路径；本地开发仍可用默认参数
  # 跑完整测量。
  microbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volttray
    steps:
      - uses: actions/checkout@v4

      # app bench 链路经 volttray-device → transport(hid 特性) → hidapi，
      # 其 build.rs 需要系统 libudev（同 ubuntu / fuzz-smoke job 的已知前提）。
      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: volttray

      # 必须按具名 bench target 跑：cargo bench --workspace 会把参数同时
      # 传给 lib 目标的 libtest harness，而 libtest 不认 criterion 的
      # --measurement-time 等参数（run 40081790791 实证：Unrecognized
      # option: 'measurement-time'）。
      - name: criterion microbenches (numbers only, no threshold)
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p volttray-protocol --bench frame_codec --locked -- \
            --measurement-time 1 --warm-up-time 0.5 --sample-size 10 \
            2>&1 | tee ../microbench.log
          cargo bench -p volttray-app --bench logic_chains --locked -- \
            --measurement-time 1 --warm-up-time 0.5 --sample-size 10 \
            2>&1 | tee -a ../microbench.log

      - name: upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microbench-log
          path: microbench.log
          if-no-files-found: ignore
          retention-days: 30

  # E19（红蓝对抗终审 P2b 批，2026-10-24）：decisions.md 冻结为只追加——
  # PR 级阻断检查：volttray/docs/decisions.md 的 diff 出现删除行即红
  # （numstat 删除列非 0）。新决策以新编号追加表尾；推翻既有条目用新
  # 条目「作废」注记表达。仅 PR 触发（push main 为已评审合并结果，
  # 同一 PR 门禁口径）；文件未改动时直接绿。
  decisions-append-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: decisions.md append-only check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          stat=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- volttray/docs/decisions.md || true)
          if [ -z "$stat" ]; then
            echo "decisions.md 未改动，通过"
            exit 0
          fi
          added=$(printf '%s' "$stat" | awk '{print $1}')
          deleted=$(printf '%s' "$stat" | awk '{print $2}')
          echo "decisions.md diff：+${added} -${deleted}"
          if [ "$deleted" != "0" ]; then
            echo "::error::decisions.md 已冻结为只追加（E19）——本 PR 删除了 ${deleted} 行既有内容。新决策请以新编号追加表尾；推翻既有条目用新条目「作废」注记表达"
            exit 1
          fi
          echo "只追加检查通过（+${added} -0）"

  # P2-7 红线守卫（C1 冲突一裁决：红线核验先 advisory——静态模式检查
  # report-only 挂 CI，不阻断；统计口径与升级条件登记于
  # docs/experience/03-release-quality-gate.md「红线守卫（advisory）」节）。
  # 检查对象：volttray/crates 内删除类调用（std::fs::remove_file /
  # remove_dir / remove_dir_all，红线 E20「绝不自动删除用户文件」）：
  # ① 裸调用——未以 `let _ =` 兜底形态出现；
  # ② 用户路径命中——删除调用同行参数含 config_dir / data_dir /
  #    home_dir / 用户 等用户文件路径特征。
  # 基线（2026-10-22 本地实测）：54 处删除类调用，全部 `let _ =` 兜底，
  # ①② 均 0 命中。「拦截 v0.3.9 类 P1」为未验证的候选收益（C1 稿原文
  # 口径，不写成实测）。
  # E16（2026-10-24 终审，A-R9 按 F-BvA-6 修正）：fuzz 扩面三处
  # （battery/stats/config 解析）＋ PR 级阻断烟测。报告口径原文
  # 「第一版挂 PR 级 5 分钟阻断烟测（信号链修复前不进 nightly）」——
  # 故挂 ci.yml（PR 同门禁）而非 nightly.yml；真实门禁、失败即红
  # （无 continue-on-error）。三目标各 100 秒 ≈ 5 分钟总量。
  # 环境口径与 nightly fuzz-smoke 一致：nightly 显式钉（RUSTUP_TOOLCHAIN
  # 压过 rust-toolchain.toml）、rust-src、taiki-e cargo-fuzz@0.13.2、
  # 显式 gnu target（taiki-e musl 版默认 target 与 ASan 不兼容，
  # nightly 首跑已实证）。libudev：device/app 经 transport 默认特性
  # 拉入 hidapi，同 ubuntu job 需系统库。
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: install system deps (libudev for hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # PR 级烟测不挂语料缓存（语料复用属 nightly 职责，F-A8）；
      # 每目标 100 秒空语料起跑即足够暴露构造性崩溃与接线退化。
      - name: fuzz smoke (3 targets x 100s, blocking)
        working-directory: volttray/fuzz
        shell: bash
        run: |
          set -euo pipefail
          for t in battery_fuzz stats_fuzz config_fuzz; do
            echo "── fuzz $t (100s) ──"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=100 -rss_limit_mb=2560
          done

      # 崩溃样本上传：if: always()（F-A8：fuzz 步红时不得被跳过）。
      - name: upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-pr-artifacts
          path: volttray/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  redline-guard-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # grep -a（G-31 统一口径，2026-10-31）：grep 的二进制判定依赖读路径 /
      # FS 语义——2026-10-22 本地沙箱网络盘 SEEK_HOLE 语义曾致 tray/src/main.rs
      # 被误判二进制、不加 -a 漏 8 处（事后字节级实测：满读 md5 与远端 blob
      # 一致、源文件干净）；加 -a 兜住读路径伪影，发现判二进制先换 FS 复判。
      - name: deletion-call static pattern check (report-only)
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          hits=$(grep -ran 'remove_file\|remove_dir' volttray/crates --include='*.rs' || true)
          total=$(printf '%s\n' "$hits" | grep -c .)
          bare=$(printf '%s\n' "$hits" | grep -v 'let _ =' || true)
          userpath=$(printf '%s\n' "$hits" | grep -iE 'config_dir|data_dir|home_dir|用户' || true)
          echo "删除类调用总数：${total}（基线 54，2026-10-22 实测）"
          if [ -n "$bare" ]; then
            echo "── ① 裸调用（无 let _ = 兜底）──"
            printf '%s\n' "$bare"
            fail=1
          else
            echo "① 裸调用：0 命中"
          fi
          if [ -n "$userpath" ]; then
            echo "── ② 删除调用命中用户文件路径特征 ──"
            printf '%s\n' "$userpath"
            fail=1
          else
            echo "② 用户路径命中：0 命中"
          fi
          echo "── 结果：fail=${fail}（report-only，不阻断；命中后人工复核，多行续行属已知误报源）──"
          exit $fail
