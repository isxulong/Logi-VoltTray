name: traffic-snapshot

# T-09（实施令 P2，2026-10-20）：访问数据周快照——单次快照双抓（C 裁决吸收 A）。
# - cron 每日 05:43 UTC（C-05：T-14/T-09 时钟检查由周一改每日，覆盖 T-14
#   裁决截止 2026-11-06 前的零信号窗口；与 audit 周检 04:37、nightly
#   03:17 UTC 全部错峰整点）；
# - 双抓一：traffic/views（平台访问数据。官方文档口径：仅返回最近 14 天
#   （https://docs.github.com/en/rest/metrics/traffic —— "Get the total
#   number of views and breakdown per day or week for the last 14 days"），
#   平台不留历史，故每周快照落 artifact、retention-days: 400 长期留存）；
# - 双抓二：releases 各资产 download_count（T-07「检查更新」门槛＝单资产
#   ≥100 下载的唯一数据源。2026-10-20 基线实测：11 个 release、15 个资产、
#   累计 137、单版最高 35——未达门槛，T-07 维持 P2）；
# - 施工第一步实测（2026-10-20）：fine-grained PAT 对 traffic/views 返回
#   403 "Resource not accessible by personal access token"（官方口径：该
#   端点要求 repo Administration 读取权限）；GITHUB_TOKEN 同级权限预计
#   同样 403——以首次实跑结果为准，403 不算红，如实写入快照 JSON 的
#   traffic_error 字段（未验证项⑥：GITHUB_TOKEN 行为待首跑实证）；
# - 退化路径（traffic 侧 403 时）：views 数据退化为维护者用带
#   Administration 读取权限的 PAT 手动 `gh api repos/isxulong/Logi-VoltTray/traffic/views`
#   + 人工归档进 docs（约 5 分钟/周）；releases 侧 download_count 用
#   GITHUB_TOKEN 即可抓取（2026-10-20 实测可读），周快照照常产出，
#   T-07 门槛取证不中断；
# - 不开单（N-2 仅覆盖 nightly/audit 两类红；本 workflow 产出数据快照，
#   无红类）、不装第三方工具（纯 curl + jq，ubuntu-latest 预装件）。
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read # 只读仓库即可（API 走 GITHUB_TOKEN，releases 端点公开可读）
  # C-05（最小权限）：issues:write 自本 advisory job 移除——到期开单须先在
  # 06 F.1 登记「时钟评审结论＝同意升级」，评审通过后由维护者在本块恢复
  #   issues: write
  # 再行启用；恢复前开单/评论写操作失败自动降级为 run 页留痕（见下方时钟步）。

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 双抓一：traffic/views。403 预期可达——写入 traffic_error 字段继续，
      # 不让整个快照失败（快照的价值一半在 releases 侧）。
      - name: fetch traffic/views (403-tolerant)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          code=$(curl -sS -o traffic_raw.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/views") || code="000"
          echo "traffic/views HTTP ${code}"
          if [ "$code" = "200" ]; then
            jq '{views: .}' traffic_raw.json > traffic_part.json
          else
            msg=$(jq -r '.message // empty' traffic_raw.json 2>/dev/null || echo "no body")
            jq -n --arg code "$code" --arg msg "$msg" \
              '{traffic_error: ("HTTP " + $code + (if $msg != "" then ": " + $msg else "" end))}' \
              > traffic_part.json
          fi

      # 双抓二：releases 各资产 download_count（T-07 门槛唯一数据源，
      # 2026-10-20 实测 GITHUB_TOKEN 同级权限可读）。
      - name: fetch releases download_count
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          page=1
          : > releases_raw.jsonl
          while :; do
            body=$(curl -sS -f \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
            echo "$body" >> releases_raw.jsonl
            n=$(echo "$body" | jq 'length')
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done
          jq -s 'add | [
            .[] | select(. != null)
            | {tag: .tag_name, prerelease: .prerelease,
               assets: [.assets[] | {name, download_count}]}
          ] | {releases: ., snapshot_at: (now | todate)}' releases_raw.jsonl \
            > releases_part.json

      # 合并单次快照 JSON：views 与 releases 字段齐备（实施令验证口径）。
      - name: merge snapshot json
        shell: bash
        run: |
          jq -s '.[0] * .[1]' traffic_part.json releases_part.json \
            > traffic-snapshot.json
          jq . traffic-snapshot.json
          total=$(jq '[.. | objects | select(has("download_count")) | .download_count] | add // 0' traffic-snapshot.json)
          peak=$(jq '[.. | objects | select(has("download_count")) | .download_count] | max // 0' traffic-snapshot.json)
          echo "T-07 门槛读数：累计 ${total}、单资产最高 ${peak}（门槛＝单资产 ≥100）"

      - name: upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffic-snapshot-${{ github.run_id }}
          path: traffic-snapshot.json
          retention-days: 400
          if-no-files-found: error

      # P0-2（C1 冲突五裁决：时钟自动化不等观察期——观察期 ≥ T-14 到期日，
      # 到期无执行主体即静默过期）：T-14/T-09 到期检查挂本 workflow 每日跑
      # （C-05：周一改每日，覆盖 T-14 裁决截止 2026-11-06 前的零信号窗口）。
      # C-10 单源：到期日不设本地常量，启动时从
      # docs/experience/06-release-reconciliation.md F.1 时钟表对应行 grep
      # 解析加粗日期（**YYYY-MM-DD**）——只改 06 跑批日期即跟随，解析失败
      # ::error 并非 0 退出（时钟失效不得静默）。T-14 口径＝裁决截止
      # 2026-11-06＋禁止到期自动接受（C-03 签发口径，单一文本以 06 为准）。
      # **首月 advisory 只报不开单**（REPORT_ONLY_UNTIL）；期满后的处置
      # 走 C-05 评审判据：仅当 06 F.1 登记「时钟评审结论＝同意升级」才执行
      # 开单（去重与 N-2 同法：label 精确查），否则仅向对账 issue（label
      # clock-review-due 的未结单）追加评论，无单可评论时 run 页留痕。
      # issues:write 已自本 job 移除（见 permissions 注记），评审通过后由
      # 维护者恢复；恢复前写操作失败自动降级为 run 页留痕、不算红。
      - name: T-14/T-09 clock due check (daily; first-month advisory, report-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          CLOCK_FILE="docs/experience/06-release-reconciliation.md"
          # C-10：到期日单源＝06 F.1 时钟表该时钟行的加粗日期（**YYYY-MM-DD**）
          parse_due() {
            grep -E "^\| $1 " "$CLOCK_FILE" \
              | grep -oE '\*\*20[0-9]{2}-[0-9]{2}-[0-9]{2}\*\*' \
              | head -1 | tr -d '*'
          }
          T14_DUE=$(parse_due 'T-14')
          T09_DUE=$(parse_due 'T-09')
          if [ -z "$T14_DUE" ] || [ -z "$T09_DUE" ]; then
            echo "::error::时钟单源解析失败（T14='${T14_DUE}' T09='${T09_DUE}'）——06 F.1 时钟表行或加粗到期日缺失，须人工修复（C-10）"
            exit 1
          fi
          REPORT_ONLY_UNTIL="2026-11-23"
          today=$(date -u +%F)
          reached() { [ "$1" = "$2" ] || [ "$1" \> "$2" ]; return; }
          echo "今日（UTC）：${today}｜T-14 到期 ${T14_DUE}（自 06 时钟表解析）｜T-09 到期 ${T09_DUE}（同上）｜advisory 只报期至 ${REPORT_ONLY_UNTIL}"
          due=""
          if reached "$today" "$T14_DUE"; then due="T-14"; fi
          if reached "$today" "$T09_DUE"; then
            if [ -n "$due" ]; then due="${due} + T-09"; else due="T-09"; fi
          fi
          if [ -z "$due" ]; then
            echo "[时钟] 无到期项（T-14/T-09 均未到期），本日仅留痕"
            exit 0
          fi
          if [ "$today" \< "$REPORT_ONLY_UNTIL" ]; then
            echo "[advisory] ${due} 已/即将到期——首月 advisory 只报不开单（P0-2）。请维护者按 06 F.1 时钟表处置并在对账区留痕。"
            exit 0
          fi
          # C-05 评审判据：06 F.1 以独立行（行首列表项）登记
          # 「时钟评审结论＝同意升级」才执行开单——锚定行首防止匹配到
          # 06 中描述本机制自身的说明文字（机制说明 ≠ 评审结论）。
          if ! grep -qE '^\s*[-*]\s*(\*\*)?时钟评审结论＝同意升级' "$CLOCK_FILE"; then
            echo "[评论] ${due} 到期且已过 advisory 期，但 06 未登记「时钟评审结论＝同意升级」（C-05）——不开单，仅向对账 issue 追加评论"
            num=$(gh issue list --state open --label clock-review-due \
              --json number --limit 1 2>/dev/null | jq -r '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$num" ]; then
              if gh issue comment "$num" \
                --body "${due} 时钟已到期、评审结论未登记（C-05：仅评论不开单）。处置出口：按 06 F.1 时钟表「到期判据与逾期处置」列执行，并在下一次发布对账留痕。"; then
                echo "[P0-2] 已向对账 issue #${num} 追加评论"
              else
                echo "[降级] issues:write 未启用（C-05：评审通过后由维护者恢复），评论写入失败——请维护者手动在对账区留痕：${due} 已到期、评审结论未登记"
              fi
            else
              echo "[留痕] 无 label=clock-review-due 的未结对账 issue 可评论；请维护者按 06 F.1 处置并在对账区留痕：${due} 已到期、评审结论未登记"
            fi
            exit 0
          fi
          echo "[开单] ${due} 到期、已过 advisory 期且 06 已登记评审结论＝同意升级，按 N-2 同法开单（label 查重）"
          if ! gh label create clock-review-due \
            --color D93F0B \
            --description "T-14/T-09 时钟到期评审（P0-2）" \
            --if-not-exists; then
            echo "[降级] issues:write 未启用（C-05：评审结论已登记，请维护者在 permissions 恢复 issues: write 后重跑本 workflow 或手动开单）——${due} 已到期"
            exit 0
          fi
          num=$(gh issue list --state open --label clock-review-due \
            --json number --limit 1 | jq -r '.[0].number // empty')
          if [ -n "$num" ]; then
            echo "[P0-2] 到期评审单已存在：#${num}，不重复开"
            exit 0
          fi
          gh issue create --label clock-review-due \
            --title "${due} 时钟到期评审（自动开单）" \
            --body "到期时钟：${due}（口径见 docs/experience/06-release-reconciliation.md F.1 时钟表）。处置出口：按时钟表「到期判据与逾期处置」列执行，并在下一次发布对账留痕。"
