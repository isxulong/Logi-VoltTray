[package]
name = "volttray-protocol"
description = "LogiVoltTray - HID++ 协议组帧/解帧（纯计算，无 I/O）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

# E20：纯逻辑链微基准（协议帧编解码），CI microbench job 跑数
[[bench]]
name = "frame_codec"
harness = false
